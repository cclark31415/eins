name: Build and deploy Eins to Azure

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'design.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

env:
  AZURE_WEBAPP_NAME: eins-chrisclark-net
  PYTHON_VERSION: '3.12'

jobs:
  build-and-deploy:
    name: Build & deploy to Azure App Service
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify dependencies install cleanly
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Stamp build timestamp into version.json
        run: |
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          tmp=$(mktemp)
          jq --arg t "$BUILD_TIME" '.buildTime = $t' version.json > "$tmp"
          mv "$tmp" version.json
          echo "Stamped buildTime=$BUILD_TIME"
          cat version.json

      - name: Stage deployment package
        run: |
          mkdir -p _deploy
          cp -r app.py Procfile requirements.txt static templates version.json _deploy/
          ls -la _deploy

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: _deploy
